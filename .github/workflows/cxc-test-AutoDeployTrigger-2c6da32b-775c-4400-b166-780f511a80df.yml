name: Trigger auto deployment for cxc-test

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/cxc-test-AutoDeployTrigger-2c6da32b-775c-4400-b166-780f511a80df.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CXCTEST_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CXCTEST_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CXCTEST_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.CXCTEST_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CXCTEST_REGISTRY_PASSWORD }}
          containerAppName: cxc-test
          resourceGroup: cxc-test
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


